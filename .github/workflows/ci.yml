name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fin_graph
          POSTGRES_PASSWORD: fin_graph
          POSTGRES_DB: fin_graph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fin_graph -d fin_graph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FIN_GRAPH_TEST_DATABASE_URL: postgresql://fin_graph:fin_graph@localhost:5432/fin_graph
      FIN_GRAPH_REQUIRE_POSTGRES: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --extra app
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv lock --check
      - run: uv run --extra app pytest
      - run: uv run --project packages/workflow pytest packages/workflow/tests
      - run: uv run fin-graph eval run --suite all --model scripted --output-dir .eval-results
      - run: uv build --wheel
      - run: uv run pytest tests/packaging -q
      - run: docker compose config
      - run: docker compose --profile distributed config
      - run: docker build -t fin-graph:compat .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  harness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra harness
      - run: uv run fin-graph harness runtime
      - run: uv run --extra harness fin-graph harness validate
      - run: uv run --extra harness better-harness validate harness/fin.toml
      - run: uv run --extra harness pytest tests/harness tests/evals/market -q
      - run: uv run --extra harness fin-graph harness smoke --output-dir .harness-runs/ci-smoke
      - run: uv run --extra harness pytest evals/harness --harness-model scripted -q
