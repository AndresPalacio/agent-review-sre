[project]
name = "fin-graph"
version = "0.1.0"
description = "Multi-agent financial analysis and paper trading built natively on LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "langgraph>=1.2.14,<1.3",
    "langchain>=1.4.3,<1.5",
    "langchain-core>=1.6.7,<1.7",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "urllib3>=2.8,<3",
    "httpx>=0.28,<0.29",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pyyaml>=6.0,<7",
    "fastapi>=0.117,<1",
    "uvicorn>=0.35,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.16,<2",
    "cryptography>=45,<48",
    "prompt-toolkit>=3.0,<4",
    "platformdirs>=4,<5",
    "apscheduler>=3.11.3,<4",
    "slack-bolt>=1.27,<2",
    "aiohttp>=3.13,<4",
    "langchain-ollama>=1.1.0,<2",
]

[project.scripts]
fin-graph = "fin_graph.cli.main:main"

[project.optional-dependencies]
agents = [
    "deepagents>=0.7.29,<0.8",
    "langgraph-sdk>=0.4.6,<0.5",
    "openai>=3.26.0,<4",
    "mcp>=1.30.0,<2",
]
quant = [
    "numpy>=2.1,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14.6,<0.15",
    "ta>=0.11,<0.12",
    "vaderSentiment>=3.3.2,<4",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
]
ml = [
    "tensorflow>=2.21,<2.22",
]
app = [
    "deepagents>=0.7.29,<0.8",
    "langgraph-sdk>=0.4.6,<0.5",
    "openai>=3.26.0,<4",
    "mcp>=1.30.0,<2",
    "numpy>=2.1,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14.6,<0.15",
    "ta>=0.11,<0.12",
    "vaderSentiment>=3.3.2,<4",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "tensorflow>=2.21,<2.22",
]
harness = [
    "better-harness",
    "deepagents>=0.7.29,<0.8",
]

[dependency-groups]
harness = [
    "better-harness",
    "deepagents>=0.7.29,<0.8",
]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.4",
    "import-linter>=2.15",
    "langgraph-cli[inmem]>=0.4.33",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_graph", "src/src", "src/v2", "src/app"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build]
artifacts = ["src/fin_graph/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -p no:langsmith_plugin"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: needs FIN_GRAPH_TEST_DATABASE_URL pointing at Postgres with pgvector",
    "ollama: needs a local Ollama server (OLLAMA_BASE_URL) with llama3.2:3b pulled",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
  "**/.scratch/**",
  "**/.runs/**",
  ".harness-runs/**",
  "src/fin_graph/skills/finance/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["fin_graph"]
exclude = ["^src/fin_graph/skills/finance/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["better_harness.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "fin_graph"

[[tool.importlinter.contracts]]
name = "fin-graph layers (dependencies point downward only)"
type = "layers"
layers = [
    "fin_graph.graphs",
    "fin_graph.agents",
    "fin_graph.integrations",
    "fin_graph.safety",
    "fin_graph.domain",
    "fin_graph.llm | fin_graph.persistence",
    "fin_graph.config",
]

[tool.uv.sources]
better-harness = { git = "https://github.com/langchain-ai/deepagents.git", subdirectory = "examples/better-harness", rev = "be75459c444b53d21d633ef2ab997a01d0739c71" }
