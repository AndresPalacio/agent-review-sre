# Official better-harness format; SRE CLI adds strict acceptance and grouped corpus checks.
[experiment]
name = "sre-rca"
runner = "pytest"
workspace_root = ".."
model = "openai:gpt-4.1-mini"
max_iterations = 3

[better_agent]
model = "anthropic:claude-sonnet-4-6"
max_turns = 40

[runner.pytest]
project_root = ".."
uv_group = "harness"
model_flag = "--harness-model"
summary_flag = "--evals-report-file"
pytest_args = ["-q", "-o", "junit_family=legacy", "-o", "testpaths=evals/harness"]

[sre]
repeat = 3
case_timeout = 180
proposer_timeout = 300
split_timeout = 3600
max_case_tokens = 100000
max_case_latency = 180
# Optional independent reference judge (also requires its provider credentials):
# judge_model = "openai:gpt-4.1-mini"
# min_judge_score = 0.8

[surfaces.tools]
kind = "workspace_file"
target = "src/fin_graph/graphs/investigation/strategy/tools.py"
filename = "tools.py"
base_file = "../src/fin_graph/graphs/investigation/strategy/tools.py"

[surfaces.skills]
kind = "workspace_file"
target = "src/fin_graph/graphs/investigation/strategy/skills.md"
filename = "skills.md"
base_file = "../src/fin_graph/graphs/investigation/strategy/skills.md"

[surfaces.planning]
kind = "workspace_file"
target = "src/fin_graph/graphs/investigation/strategy/planning.py"
filename = "planning.py"
base_file = "../src/fin_graph/graphs/investigation/strategy/planning.py"

[surfaces.middleware]
kind = "workspace_file"
target = "src/fin_graph/graphs/investigation/strategy/middleware.py"
filename = "middleware.py"
base_file = "../src/fin_graph/graphs/investigation/strategy/middleware.py"

[surfaces.middleware_registration]
kind = "workspace_file"
target = "src/fin_graph/graphs/investigation/strategy/registration.py"
filename = "registration.py"
base_file = "../src/fin_graph/graphs/investigation/strategy/registration.py"

[surfaces.plan]
kind = "module_attr"
target = "fin_graph.graphs.investigation.prompts:PLAN_PROMPT"
filename = "plan.txt"
base_value = "Propose 1-4 falsifiable hypotheses and one concrete task per useful available domain."

[surfaces.specialist]
kind = "module_attr"
target = "fin_graph.graphs.investigation.prompts:SPECIALIST_PROMPT"
filename = "specialist.txt"
base_value = "Return a finding grounded in the observed evidence."

[surfaces.synthesis]
kind = "module_attr"
target = "fin_graph.graphs.investigation.prompts:SYNTHESIS_PROMPT"
filename = "synthesis.txt"
base_value = "Write an incident-command diagnosis. Keep unsupported causes unknown and cite evidence ids."

[surfaces.judge]
kind = "module_attr"
target = "fin_graph.graphs.investigation.prompts:JUDGE_PROMPT"
filename = "judge.txt"
base_value = "Decide whether these specific observations support the factual claim. Be skeptical."

[[cases]]
case_id = "evals/harness/train/test_rca.py::test_rca[eks/000-healthy]"
split = "train"
stratum = "eks"

