services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fin_graph
      POSTGRES_PASSWORD: fin_graph
      POSTGRES_DB: fin_graph
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin_graph -d fin_graph"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
