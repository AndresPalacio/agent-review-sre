services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sre_graph
      POSTGRES_PASSWORD: sre_graph
      POSTGRES_DB: sre_graph
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_graph -d sre_graph"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
