[project]
name = "sre-graph"
version = "0.1.0"
description = "Multi-agent incident investigation (RCA) built natively on LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "langgraph>=1.2.14,<1.3",
    "langchain>=1.4.3,<1.5",
    "langchain-core>=1.6.7,<1.7",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "kubernetes>=37.0.0",
    "urllib3>=2.8,<3",
    "httpx>=0.28,<0.29",
    "boto3>=1.40,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pyyaml>=6.0,<7",
    "fastapi>=0.117,<1",
    "uvicorn>=0.35,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.16,<2",
    "cryptography>=45,<48",
    "prompt-toolkit>=3.0,<4",
    "platformdirs>=4,<5",
    "apscheduler>=3.11.3,<4",
    "slack-bolt>=1.27,<2",
    "aiohttp>=3.13,<4",
]

[project.scripts]
sre-graph = "sre_graph.cli.main:main"

[dependency-groups]
lab = [
    "sre-deepagents",
    "sre-better-harness",
]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.4",
    "import-linter>=2.15",
    "langgraph-cli[inmem]>=0.4.33",
    "types-pyyaml>=6.0,<7",
]

[tool.uv]
default-groups = ["dev", "lab"]

[tool.uv.sources]
sre-deepagents = { path = "projects/sre-deepagents", editable = true }
sre-better-harness = { path = "projects/sre-better-harness", editable = true }
better-harness = { git = "https://github.com/langchain-ai/deepagents", rev = "4251519a9e2244e8ed3996107efe4d30bbd6d9b4", subdirectory = "examples/better-harness" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_graph"]

[tool.hatch.build]
artifacts = ["src/sre_graph/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -p no:langsmith_plugin"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: needs SRE_GRAPH_TEST_DATABASE_URL pointing at Postgres with pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sre_graph"]
# The Kubernetes SDK types its API classes but not its kubeconfig loaders.
untyped_calls_exclude = ["kubernetes.config"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "sre_graph"

[[tool.importlinter.contracts]]
name = "sre-graph layers (dependencies point downward only)"
type = "layers"
layers = [
    "sre_graph.graphs",
    "sre_graph.agents",
    "sre_graph.integrations",
    "sre_graph.safety",
    "sre_graph.domain",
    "sre_graph.llm | sre_graph.persistence",
    "sre_graph.config",
]
